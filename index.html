<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calorie Counter</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="bg-gray-100">
    <div class="max-w-lg mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">
      <h1 class="text-3xl font-bold text-center mb-6">Calorie Counter</h1>

      <form id="foodForm" class="space-y-4">
        <input
          type="text"
          id="foodName"
          placeholder="Food Name"
          class="w-full border rounded p-2"
          required/>

        <input
          type="number"
          id="calories"
          placeholder="Calories"
          class="w-full border rounded p-2"
          required />

        <button
          type="submit"
          class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600"
        >
          Add Food
        </button>
      </form>

      <ul id="foodList" class="mt-6 space-y-2">
        <!-- Food items will be added here by JavaScript -->
      </ul>

      <h2 class="text-xl font-semibold mt-6">
        Total Calories:
        <span id="totalCalories">0</span>
      </h2>

      <button
        id="resetBtn"
        class="w-full mt-4 bg-red-500 text-white p-2 rounded hover:bg-red-600"
      >
        Reset
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
